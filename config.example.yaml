default_model: fast

system_prompt: >-
  You are DearFlow, a helpful general-purpose agent. Use tools when they are
  useful and explain results clearly.

models:
  fast:
    model: openai:ilmu-mini-v3.3
  reasoning:
    model: openai:ilmu-v3.1

tools:
  - name: current_time
    group: utility
    use: dearflow.tools.builtins:current_time
  - name: calculator
    group: math
    use: dearflow.tools.builtins:calculator

skills:
  enabled: true
  path: skills

# What the model sees each turn.
context:
  timezone: null          # e.g. Asia/Kuala_Lumpur; null = machine zone
  date_reminder: true     # hidden <current_date> message, about once per day
  summarization:
    enabled: true
    trigger_tokens: 100000
    keep_messages: 20
    model: null           # alias for a cheaper summarizer; null = the run's model
  title:
    enabled: true
    use_model: false      # false = first message, shortened (no extra model call)
    max_words: 6

# Delegation: the lead agent gets a `task` tool that runs a subagent in a fresh
# context. Off by default (also: `dearflow --subagents`).
subagents:
  enabled: false
  max_concurrent: 3       # task calls per model response (run in parallel)
  max_total: 6            # task calls per user message
  max_turns: 25
  timeout_seconds: 300
  custom_agents: {}
  #  reviewer:
  #    description: Reviews a draft and lists problems.
  #    system_prompt: You review text critically and report concrete issues.
  #    tools: []          # allowlist; omit = all of the lead agent's tools
  #    model: inherit     # or a model alias such as `reasoning`

# Plan mode adds the write_todos task list (also: `dearflow --plan`).
plan_mode: false
