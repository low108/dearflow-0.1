default_model: fast

system_prompt: >-
  You are DearFlow, a helpful general-purpose agent. Use tools when they are
  useful and explain results clearly.

models:
  fast:
    model: openai:ilmu-mini-v3.3
  reasoning:
    model: openai:ilmu-v3.1

tools:
  - name: current_time
    group: utility
    use: dearflow.tools.builtins:current_time
  - name: calculator
    group: math
    use: dearflow.tools.builtins:calculator

skills:
  enabled: true
  path: skills

# What the model sees each turn.
context:
  timezone: null          # e.g. Asia/Kuala_Lumpur; null = machine zone
  date_reminder: true     # hidden <current_date> message, about once per day
  summarization:
    enabled: true
    trigger_tokens: 100000
    keep_messages: 20
    model: null           # alias for a cheaper summarizer; null = the run's model
  title:
    enabled: true
    use_model: false      # false = first message, shortened (no extra model call)
    max_words: 6

# Tool receipts: every tool result is stamped with a record (tool, status, hashes of
# arguments and output; never the output itself). Subagents cite receipts as [r1] in their
# reports, and the lead gets a `citations:` line saying whether the cited calls happened.
verification:
  receipts_enabled: true
  receipts_render_mode: delegation_only   # lead agent: show the receipt list only while reading a subagent's result (or: always)

# Hide personal data from the model: emails, API keys, card numbers (Luhn-checked), phone
# numbers, national IDs. Each is replaced by a stable placeholder like [EMAIL_abc...].
# The stored conversation keeps the original. token_secret is required (16+ characters).
pii_redaction:
  enabled: false
  token_secret: $PII_TOKEN_SECRET
  redact_email: true
  redact_api_key: true
  redact_credit_card: true
  redact_phone: true
  redact_national_id: true
  tool_names: []           # extra tools whose results come from outside (MCP tools always do)

# Token counting is on by default: every model call of a run (lead agent, subagents,
# title/summary) is added up and saved with the run record.
token_usage:
  enabled: true

# A per-run token limit. At warn_threshold the model is told to wrap up; at
# hard_stop_threshold its tool calls are removed so it must answer. Subagents share it.
token_budget:
  enabled: false
  max_tokens: 200000       # input + output
  max_input_tokens: null   # optional separate caps
  max_output_tokens: null
  warn_threshold: 0.8
  hard_stop_threshold: 1.0

# Prevent a model from calling the same tool with the same arguments forever.
# A warning is added only to the next model request; at the hard limit, the new
# call is removed before it reaches the tools node.
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20

# Optional middleware snapshots in LangSmith (see docs/observability.md).
# Export requires LANGSMITH_TRACING=true and LANGSMITH_API_KEY in the process environment.
# capture_content controls custom snapshots only; native LangSmith traces have their own payloads.
observability:
  middleware_snapshots: false
  capture_content: false      # true includes bounded, redacted messages and tool arguments/results
  max_snapshot_chars: 20000   # per snapshot; larger payloads are marked truncated

# HTTP API: `dearflow-gateway` (also `--host`, `--port`). Set api_key before exposing it.
gateway:
  host: 127.0.0.1
  port: 8001
  api_key: null           # e.g. $GATEWAY_API_KEY -> clients send `Authorization: Bearer <key>`
  cors_origins: []        # e.g. ["http://localhost:3000"] for a browser UI
  heartbeat_seconds: 15   # keep-alive comment on idle SSE streams
  retain_seconds: 120     # finished runs stay joinable from memory this long

# Saved conversations. On: messages are checkpointed to a SQLite file, and thread
# and run records are kept beside them. Restart with the same --thread-id to
# continue (also: `dearflow --persist`, `dearflow --list-threads`).
persistence:
  enabled: false
  path: data/dearflow.db

# Tools from external MCP servers (https://modelcontextprotocol.io). Each server
# is loaded independently at startup; one that fails is logged and skipped.
# `$NAME` in command/args/env/url/headers is read from the environment.
mcp:
  enabled: false
  load_timeout_seconds: 60
  servers: {}
  #  github:
  #    type: stdio                  # stdio | http | sse
  #    command: npx
  #    args: ["-y", "@modelcontextprotocol/server-github"]
  #    env: {GITHUB_TOKEN: $GITHUB_TOKEN}
  #    tool_name_prefix: true       # tools appear as github_<tool>
  #  docs:
  #    type: http
  #    url: https://example.com/mcp
  #    headers: {Authorization: "Bearer $DOCS_TOKEN"}

# Long-term memory: facts about the user, learned in the background after each
# turn and shown to the model at the start of the next one. Off by default
# (also: `dearflow --memory --user-id ann`).
memory:
  enabled: false
  storage_path: memory    # memory/<user_id>/memory.json
  injection_enabled: true
  debounce_seconds: 10    # wait for quiet, then ONE extraction call for the burst
  max_facts: 100
  confidence_threshold: 0.7
  max_injection_tokens: 1500
  model: null             # alias for the extraction model; null = default_model

# Delegation: the lead agent gets a `task` tool that runs a subagent in a fresh
# context. Off by default (also: `dearflow --subagents`).
subagents:
  enabled: false
  max_concurrent: 3       # task calls per model response (run in parallel)
  max_total: 6            # task calls per user message
  max_turns: 25
  timeout_seconds: 300
  custom_agents: {}
  #  reviewer:
  #    description: Reviews a draft and lists problems.
  #    system_prompt: You review text critically and report concrete issues.
  #    tools: []          # allowlist; omit = all of the lead agent's tools
  #    model: inherit     # or a model alias such as `reasoning`

# Plan mode adds the write_todos task list (also: `dearflow --plan`).
plan_mode: false
