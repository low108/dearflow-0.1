default_model: fast

system_prompt: >-
  You are DearFlow, a helpful general-purpose agent. Use tools when they are
  useful and explain results clearly.

models:
  fast:
    model: openai:ilmu-mini-v3.3
  reasoning:
    model: openai:ilmu-v3.1

tools:
  - name: current_time
    group: utility
    use: dearflow.tools.builtins:current_time
  - name: calculator
    group: math
    use: dearflow.tools.builtins:calculator

skills:
  enabled: true
  path: skills

# What the model sees each turn.
context:
  timezone: null          # e.g. Asia/Kuala_Lumpur; null = machine zone
  date_reminder: true     # hidden <current_date> message, about once per day
  summarization:
    enabled: true
    trigger_tokens: 100000
    keep_messages: 20
    model: null           # alias for a cheaper summarizer; null = the run's model
  title:
    enabled: true
    use_model: false      # false = first message, shortened (no extra model call)
    max_words: 6

# HTTP API: `dearflow-gateway` (also `--host`, `--port`). Set api_key before exposing it.
gateway:
  host: 127.0.0.1
  port: 8001
  api_key: null           # e.g. $GATEWAY_API_KEY -> clients send `Authorization: Bearer <key>`
  cors_origins: []        # e.g. ["http://localhost:3000"] for a browser UI
  heartbeat_seconds: 15   # keep-alive comment on idle SSE streams
  retain_seconds: 120     # finished runs stay joinable from memory this long

# Saved conversations. On: messages are checkpointed to a SQLite file, and thread
# and run records are kept beside them. Restart with the same --thread-id to
# continue (also: `dearflow --persist`, `dearflow --list-threads`).
persistence:
  enabled: false
  path: data/dearflow.db

# Tools from external MCP servers (https://modelcontextprotocol.io). Each server
# is loaded independently at startup; one that fails is logged and skipped.
# `$NAME` in command/args/env/url/headers is read from the environment.
mcp:
  enabled: false
  load_timeout_seconds: 60
  servers: {}
  #  github:
  #    type: stdio                  # stdio | http | sse
  #    command: npx
  #    args: ["-y", "@modelcontextprotocol/server-github"]
  #    env: {GITHUB_TOKEN: $GITHUB_TOKEN}
  #    tool_name_prefix: true       # tools appear as github_<tool>
  #  docs:
  #    type: http
  #    url: https://example.com/mcp
  #    headers: {Authorization: "Bearer $DOCS_TOKEN"}

# Long-term memory: facts about the user, learned in the background after each
# turn and shown to the model at the start of the next one. Off by default
# (also: `dearflow --memory --user-id ann`).
memory:
  enabled: false
  storage_path: memory    # memory/<user_id>/memory.json
  injection_enabled: true
  debounce_seconds: 10    # wait for quiet, then ONE extraction call for the burst
  max_facts: 100
  confidence_threshold: 0.7
  max_injection_tokens: 1500
  model: null             # alias for the extraction model; null = default_model

# Delegation: the lead agent gets a `task` tool that runs a subagent in a fresh
# context. Off by default (also: `dearflow --subagents`).
subagents:
  enabled: false
  max_concurrent: 3       # task calls per model response (run in parallel)
  max_total: 6            # task calls per user message
  max_turns: 25
  timeout_seconds: 300
  custom_agents: {}
  #  reviewer:
  #    description: Reviews a draft and lists problems.
  #    system_prompt: You review text critically and report concrete issues.
  #    tools: []          # allowlist; omit = all of the lead agent's tools
  #    model: inherit     # or a model alias such as `reasoning`

# Plan mode adds the write_todos task list (also: `dearflow --plan`).
plan_mode: false
